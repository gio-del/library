<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Libreria</title>
<meta name="theme-color" content="#2d3a4a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-maskable-192.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>Libreria</h1>
  <nav id="nav" hidden>
    <button id="tab-scan" type="button">Scansiona</button>
    <button id="tab-lib" type="button">Libreria</button>
    <button id="logout" type="button">Esci</button>
  </nav>
</header>
<main>
  <section id="login" hidden>
    <form id="login-form">
      <label>Utente <input id="user" autocomplete="username"></label>
      <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Accedi</button>
      <p id="login-msg" class="msg" role="alert"></p>
    </form>
  </section>
  <section id="scan" hidden>
    <video id="video" playsinline muted hidden></video>
    <button id="camera" type="button">Apri la fotocamera</button>
    <form id="manual-form">
      <label>ISBN, titolo o autore <input id="isbn" autocomplete="off" placeholder="978… oppure titolo"></label>
      <button type="submit">Controlla</button>
    </form>
    <p id="scan-msg" class="msg" role="status"></p>
    <ul id="results"></ul>
    <button id="add-manual" type="button">Non lo trovo: aggiungilo a mano</button>
    <article id="verdict" hidden>
      <h2 id="verdict-text"></h2>
      <img id="verdict-cover" alt="" hidden>
      <p id="verdict-title"></p>
      <p id="verdict-authors"></p>
      <button id="verdict-add" type="button" hidden>Salva</button>
      <button id="verdict-open" type="button" hidden>Apri scheda</button>
    </article>
    <article id="card" hidden>
      <img id="card-cover" alt="">
      <h2 id="card-title"></h2>
      <p id="card-authors"></p>
      <p id="card-meta"></p>
      <p id="card-state" class="badge"></p>
      <button id="card-read" type="button"></button>
      <button id="card-again" type="button" hidden>Cerca di nuovo</button>
    </article>
  </section>
  <section id="manual" hidden>
    <h2>Aggiungi a mano</h2>
    <form id="m-form">
      <label>Titolo (obbligatorio) <input id="m-title" required maxlength="300"></label>
      <label>Autori (separati da virgola) <input id="m-authors"></label>
      <label>Editore <input id="m-publisher"></label>
      <label>Anno <input id="m-year" inputmode="numeric"></label>
      <label>Edizione <input id="m-edition"></label>
      <label>Lingua <input id="m-language"></label>
      <label>Pagine <input id="m-pages" inputmode="numeric"></label>
      <label>ISBN (se c’è) <input id="m-isbn" inputmode="numeric" autocomplete="off"></label>
      <label>Note <textarea id="m-notes" rows="3" maxlength="1000"></textarea></label>
      <label class="btn">Copertina (foto o immagine) <input id="m-cover" type="file" accept="image/*" hidden></label>
      <p id="m-cover-name"></p>
      <button type="submit">Salva</button>
      <button id="m-cancel" type="button">Annulla</button>
    </form>
    <p id="m-msg" class="msg" role="status"></p>
  </section>
  <section id="detail" hidden>
    <button id="d-back" type="button">← Torna all’elenco</button>
    <img id="d-cover" alt="" hidden>
    <h2 id="d-title"></h2>
    <p id="d-state" class="badge"></p>
    <dl id="d-fields"></dl>
    <p id="d-msg" class="msg" role="status"></p>
    <form id="d-form" hidden>
      <label>Titolo <input id="e-title"></label>
      <label>Autori (separati da virgola) <input id="e-authors"></label>
      <label>Generi (separati da virgola) <input id="e-genres"></label>
      <label>Edizione <input id="e-edition"></label>
      <label>Editore <input id="e-publisher"></label>
      <label>Anno <input id="e-year" inputmode="numeric"></label>
      <label>Collana <input id="e-series"></label>
      <label>Pagine <input id="e-pages" inputmode="numeric"></label>
      <label>Lingua <input id="e-language"></label>
      <label>Note <textarea id="e-notes" rows="3" maxlength="1000"></textarea></label>
      <button type="submit">Salva</button>
      <button id="d-cancel" type="button">Annulla</button>
    </form>
    <div id="d-actions">
      <button id="d-read" type="button"></button>
      <button id="d-edit" type="button">Modifica</button>
      <label id="d-cover-pick" class="btn">Cambia copertina <input id="d-cover-file" type="file" accept="image/*" hidden></label>
      <button id="d-delete" type="button" class="danger">Elimina</button>
    </div>
  </section>
  <section id="lib" hidden>
    <p id="lib-msg" class="msg" role="status"></p>
    <div id="filters" role="group" aria-label="Filtro">
      <button id="f-all" type="button"></button>
      <button id="f-toread" type="button"></button>
      <button id="f-read" type="button"></button>
    </div>
    <div id="genres" role="group" aria-label="Genere"></div>
    <button id="retry-all" type="button" hidden>Cerca di nuovo i libri senza dati o copertina</button>
    <button id="reclassify" type="button">Rileggi i generi (senza toccare quelli corretti)</button>
    <ul id="grid"></ul>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
